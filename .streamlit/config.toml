[theme]
base = "light"
primaryColor = "#2e7d32"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f8e9"
textColor = "#1b4332"
font = "sans serif"

[server]
# Allow the app to be embedded as an iframe on lcatraining.nl
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

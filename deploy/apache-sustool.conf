# Apache reverse proxy for SusTool on lcatraining.nl
# Target URL: https://www.lcatraining.nl/sustool-app/
#
# Your WordPress system info shows: Webserver Info = Apache
# Document root: /data/www/vhosts/lcatraining.nl/httpdocs/
#
# Enable modules (once, as root/admin):
#   a2enmod proxy proxy_http proxy_wstunnel rewrite headers ssl
#   systemctl reload apache2
# On Plesk, enable "proxy" / "proxy_http" / "rewrite" in Apache modules,
# or ask the host to enable them.
#
# Place this inside the HTTPS VirtualHost for www.lcatraining.nl
# (Plesk: Domains → lcatraining.nl → Apache & nginx Settings →
#  Additional directives for HTTPS), OR in a file included by that vhost.

# WebSocket upgrade for Streamlit
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/sustool-app/(.*)           ws://127.0.0.1:8501/$1 [P,L]
RewriteCond %{HTTP:Upgrade} !=websocket [NC]
RewriteRule ^/sustool-app/(.*)           http://127.0.0.1:8501/$1 [P,L]

ProxyPreserveHost On
ProxyPass /sustool-app/                  http://127.0.0.1:8501/
ProxyPassReverse /sustool-app/           http://127.0.0.1:8501/

# Longer timeouts for Streamlit interactive sessions
ProxyTimeout 86400

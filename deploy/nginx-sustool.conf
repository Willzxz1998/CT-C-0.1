# Reverse proxy: expose Streamlit under https://www.lcatraining.nl/sustool-app/
# Merge this `location` into the existing HTTPS server block for lcatraining.nl
# (do not replace the whole WordPress config).

# Example — place inside: server { listen 443 ssl; server_name www.lcatraining.nl; ... }

location /sustool-app/ {
    proxy_pass http://127.0.0.1:8501/;
    proxy_http_version 1.1;

    # Required for Streamlit WebSockets
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 86400;
}

# Optional: if Streamlit static assets fail under a sub-path, prefer a subdomain instead:
#   server_name sustool.lcatraining.nl;
#   location / { proxy_pass http://127.0.0.1:8501/; ... same headers ... }

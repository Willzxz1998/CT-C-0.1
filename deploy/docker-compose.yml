services:
  sustool:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ../:/app
    command: >
      bash -c "pip install --no-cache-dir -r requirements.txt
      && streamlit run app.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.headless=true
      --browser.gatherUsageStats=false"
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped
